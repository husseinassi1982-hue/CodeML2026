<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#075e54" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>DayOne Agent — WhatsApp prototype</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: "Segoe UI", Helvetica, system-ui, sans-serif;
        background: #1b2a33;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .phone {
        width: 100%;
        max-width: 430px;
        height: 92vh;
        min-height: 620px;
        display: flex;
        flex-direction: column;
        background: #ece5dd;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55);
      }

      /* ===== Header ===== */
      header {
        background: #075e54;
        color: #fff;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .avatar {
        width: 38px; height: 38px;
        border-radius: 50%;
        background: #25d366;
        display: flex; align-items: center; justify-content: center;
        font-size: 19px;
        flex-shrink: 0;
      }
      .htitle { flex: 1; min-width: 0; }
      .hname { font-weight: 600; font-size: 15px; }
      .hstatus { font-size: 11px; opacity: 0.85; }
      .hname, .hstatus { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #conn, #lang { flex-shrink: 0; }
      #conn {
        border: none;
        border-radius: 14px;
        padding: 5px 10px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        color: #053a30;
        background: #a5f0c5;
      }
      #conn.off { background: #f6c9a8; color: #5a2c0b; }
      /* language picker, top right (the header keeps this layout in Arabic too) */
      #lang {
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 14px;
        padding: 4px 6px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        color: #fff;
        background: rgba(255, 255, 255, 0.12);
        font-family: inherit;
      }
      #lang option { color: #111; }

      /* ===== Status strip (record lifecycle) ===== */
      .strip {
        background: #074a43;
        color: #cfe9e2;
        font-size: 10px;
        padding: 6px 10px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }
      .chip {
        background: rgba(255, 255, 255, 0.12);
        padding: 2px 6px;
        border-radius: 8px;
        white-space: nowrap;
      }
      .chip.done { background: rgba(37, 211, 102, 0.4); color: #eafff3; }
      .chip.active { background: #25d366; color: #05312a; font-weight: 700; }
      .sep { opacity: 0.4; }
      #qbadge {
        margin-inline-start: auto;
        background: #b7791f;
        color: #fff;
        padding: 2px 8px;
        border-radius: 8px;
        font-weight: 700;
        display: none;
      }
      .lock {
        width: 100%;
        opacity: 0.65;
        font-size: 9px;
        padding-top: 2px;
      }

      /* ===== Chat area ===== */
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 14px 10px 6px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        background-color: #ece5dd;
        background-image: radial-gradient(rgba(0, 0, 0, 0.045) 1.5px, transparent 1.5px);
        background-size: 20px 20px;
      }

      .msg { display: flex; }
      .msg.in { justify-content: flex-start; }
      .msg.out { justify-content: flex-end; }

      .bubble {
        position: relative;
        max-width: 82%;
        padding: 7px 10px 16px;
        border-radius: 10px;
        font-size: 13.5px;
        line-height: 1.45;
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.14);
        word-wrap: break-word;
        animation: pop 0.18s ease-out;
      }
      @keyframes pop {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      .msg.in .bubble { background: #fff; border-top-left-radius: 2px; }
      .msg.out .bubble { background: #d9fdd3; border-top-right-radius: 2px; }
      [dir="rtl"] .msg.in .bubble { border-top-left-radius: 10px; border-top-right-radius: 2px; }
      [dir="rtl"] .msg.out .bubble { border-top-right-radius: 10px; border-top-left-radius: 2px; }
      [dir="rtl"] #send, [dir="rtl"] #psend { transform: scaleX(-1); }

      .meta {
        position: absolute;
        inset-inline-end: 8px; bottom: 3px;
        font-size: 9.5px;
        color: #8a9291;
        display: flex; gap: 3px; align-items: center;
      }
      .ticks { color: #34b7f1; font-size: 10px; }

      .photo {
        display: block;
        max-width: 210px;
        width: 100%;
        border-radius: 7px;
        margin-bottom: 4px;
      }

      .mut { color: #6b7472; font-size: 11.5px; }
      .pcard {
        background: #f4f6f7;
        border-inline-start: 3px solid #25d366;
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 12.5px;
      }

      /* typing indicator */
      .dots { display: inline-flex; gap: 4px; padding: 4px 2px; }
      .dots i {
        width: 7px; height: 7px;
        background: #9aa5a3;
        border-radius: 50%;
        animation: blink 1.1s infinite;
      }
      .dots i:nth-child(2) { animation-delay: 0.2s; }
      .dots i:nth-child(3) { animation-delay: 0.4s; }
      @keyframes blink { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }

      .sys {
        align-self: center;
        background: #fdf3c4;
        color: #5c5433;
        font-size: 11px;
        padding: 4px 12px;
        border-radius: 9px;
        margin: 2px 0;
      }

      /* ===== Quick-reply buttons ===== */
      .btns {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-self: flex-start;
        max-width: 82%;
        margin-bottom: 6px;
      }
      .qr {
        background: #fff;
        border: 1px solid #ddd;
        color: #0084ff;
        font-size: 13px;
        padding: 8px 14px;
        border-radius: 16px;
        cursor: pointer;
        text-align: start;
        animation: pop 0.18s ease-out;
        transition: background 0.15s;
      }
      .qr:hover { background: #f0f8ff; }

      /* ===== Image preview bar ===== */
      #preview {
        display: none;
        align-items: center;
        gap: 8px;
        background: #e6ded4;
        padding: 8px;
        border-top: 1px solid rgba(0, 0, 0, 0.08);
      }
      #preview img {
        width: 54px;
        height: 54px;
        object-fit: cover;
        border-radius: 7px;
      }
      #pcaption {
        flex: 1;
        border: none;
        border-radius: 16px;
        padding: 9px 14px;
        font-size: 13px;
        outline: none;
      }
      #psend {
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 50%;
        background: #25d366;
        color: #fff;
        font-size: 17px;
        cursor: pointer;
        flex-shrink: 0;
      }
      #pclear {
        width: 34px;
        height: 34px;
        border: none;
        border-radius: 50%;
        background: #fff;
        color: #d34545;
        font-size: 14px;
        cursor: pointer;
        flex-shrink: 0;
      }

      /* ===== Composer ===== */
      .composer {
        background: #f0f0f0;
        padding: 8px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .cbtn {
        width: 40px; height: 40px;
        border-radius: 50%;
        border: none;
        background: #fff;
        font-size: 18px;
        cursor: pointer;
        flex-shrink: 0;
        color: #444;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
      }
      .cbtn:hover { background: #f0f8ff; }
      #input {
        flex: 1;
        border: none;
        border-radius: 20px;
        padding: 10px 16px;
        font-size: 14px;
        outline: none;
        background: #fff;
      }
      #send { background: #25d366; color: #fff; }
    </style>
  </head>
  <body>
    <div class="phone">
      <header dir="ltr">
        <div class="avatar">🩺</div>
        <div class="htitle" dir="auto">
          <div class="hname" data-i18n="agent_name">DayOne Agent</div>
          <div class="hstatus" id="statusline">online</div>
        </div>
        <button id="conn">📶 Online</button>
        <select id="lang" aria-label="Language / Langue / اللغة">
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="ar">العربية</option>
        </select>
      </header>

      <div class="strip">
        <div id="chips" style="display: contents"></div>
        <span id="qbadge"></span>
        <div class="lock" id="lock" data-i18n="lock">🔒 Photos kept encrypted on this phone until sent · names &amp; identifiers never stored · paper registry stays the reference</div>
      </div>

      <div id="chat"></div>

      <div id="preview">
        <img id="pimg" alt="selected registry page preview" data-i18n-alt="preview_alt" />
        <input id="pcaption" placeholder="Caption (optional)…" autocomplete="off" data-i18n-placeholder="caption_ph" />
        <button id="psend" title="Send photo" data-i18n-title="send_photo">➤</button>
        <button id="pclear" title="Remove" data-i18n-title="remove">✕</button>
      </div>

      <div class="composer">
        <button class="cbtn" id="attach" title="Send a registry photo" data-i18n-title="attach">📎</button>
        <input id="input" placeholder="Type a message…" autocomplete="off" data-i18n-placeholder="input_ph" />
        <button class="cbtn" id="send" title="Send" data-i18n-title="send">➤</button>
        <input type="file" id="file" accept="image/*" hidden />
      </div>
    </div>

         confidence and patient suggestion comes from the API.

         and every photo is first saved ENCRYPTED on the phone (Outbox below). It is uploaded to
         the processing server when the phone has network, and deleted from the phone only once
         the server confirms it has it. With no network the midwife can keep photographing pages. */

      function pickLang() {
        let saved = null;
        try { saved = localStorage.getItem("dayone.lang"); } catch (e) { /* storage blocked */ }
        if (saved && LANGS[saved]) return saved;
        const nav = (navigator.language || "en").slice(0, 2);
        return LANGS[nav] ? nav : "en";
      }
      let LANG = pickLang();

      // t("key", {n: 3}) -> the text in the current language; {name} placeholders are filled in.
      // Values that end up inside HTML must already be escaped by the caller.
      function t(key, vars) {
        const s = I18N[LANG][key] ?? I18N.en[key] ?? key;
        return vars ? s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m)) : s;
      }
      // Field names: French for Arabic too (as printed on the paper registry).
      function lbl(f) { return LANG === "en" ? f.label_en : f.label_fr; }
      // -> HTML
      function question(f) {
        if (LANG === "en") return esc(f.question_en || f.question_fr);
        if (LANG === "fr") return esc(f.question_fr);
        return t(f.kind === "check" ? "q_check" : f.kind === "radio" ? "q_radio" : "q_value", { label: val(f.label_fr) });
      }
      function stName(s) { return t(s); }
      function pageName(p) { return I18N[LANG][p] || I18N.en[p] || p; }
      // Values (dates, numbers, codes) keep their own direction inside Arabic sentences.
      function val(v) { return "<bdi>" + esc(v) + "</bdi>"; }
      function when(d, dateOnly) {
        return dateOnly ? d.toLocaleDateString(LANGS[LANG].locale) : d.toLocaleString(LANGS[LANG].locale);
      }

      function applyLang() {
        document.documentElement.lang = LANG;
        document.documentElement.dir = LANGS[LANG].dir;
        document.getElementById("lang").value = LANG;
        document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
        document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
        document.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = t(el.dataset.i18nTitle); });
        document.querySelectorAll("[data-i18n-alt]").forEach(el => { el.alt = t(el.dataset.i18nAlt); });
        document.querySelectorAll(".strip .sep").forEach(el => { el.textContent = LANGS[LANG].dir === "rtl" ? "←" : "→"; });
      }

      // The phone has network if the OS says so and the demo switch is not set to offline.
      function phoneOnline() { return navigator.onLine && !S.simOffline; }

      /* ================= Phone-side offline store =================
         Photos wait here, encrypted with AES-GCM (WebCrypto). The key is generated on the phone
         and is not exportable: the page can use it, nothing can read it out. Needs a secure page
         (https://, or http://localhost); see README "Phone setup". */
      const Outbox = (() => {
        const ok = !!(window.isSecureContext && window.crypto && crypto.subtle && window.indexedDB);
        let dbp = null, keyp = null;
        function db() {
          return dbp = dbp || new Promise((res, rej) => {
            const r = indexedDB.open("dayone", 1);
            r.onupgradeneeded = () => {
              r.result.createObjectStore("keys");
              r.result.createObjectStore("outbox", { keyPath: "id" });
            };
            r.onsuccess = () => res(r.result);
            r.onerror = () => rej(r.error);
          });
        }
        async function tx(store, mode, fn) {
          const d = await db();
          return new Promise((res, rej) => {
            const t = d.transaction(store, mode);
            const req = fn(t.objectStore(store));
            t.oncomplete = () => res(req.result);
            t.onerror = t.onabort = () => rej(t.error);
          });
        }
        function key() {
          return keyp = keyp || (async () => {
            const k = await tx("keys", "readonly", st => st.get("photo"));
            if (k) return k;
            const fresh = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
            await tx("keys", "readwrite", st => st.put(fresh, "photo"));
            return fresh;
          })();
        }
        async function add(blob, midwife_id) {
          const iv = crypto.getRandomValues(new Uint8Array(12));
          const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await key(), await blob.arrayBuffer());
          const item = { id: crypto.randomUUID(), iv, data, type: blob.type || "image/jpeg",
                         captured_at: new Date().toISOString(), midwife_id };
          await tx("outbox", "readwrite", st => st.put(item));
          return item;
        }
        async function list() {
          const all = await tx("outbox", "readonly", st => st.getAll());
          return all.sort((a, b) => a.captured_at.localeCompare(b.captured_at));
        }
        async function open(item) {
          const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: item.iv }, await key(), item.data);
          return new Blob([plain], { type: item.type });
        }
        function remove(id) { return tx("outbox", "readwrite", st => st.delete(id)); }
        async function count() { return ok ? (await list()).length : 0; }
        return { ok, add, list, open, remove, count };
      })();

      /* ================= API ================= */
      async function api(method, path, body, isForm) {
        if (!phoneOnline()) throw { offline: true, detail: t("err_offline") };
        let res;
        try {
          res = await fetch(API + path, {
            method,
            headers: isForm || !body ? {} : { "Content-Type": "application/json" },
            body: isForm ? body : body ? JSON.stringify(body) : undefined
          });
        } catch (e) {
          throw { offline: true, detail: t("err_server") };
        }
        let data = null;
        try { data = await res.json(); } catch (e) { /* no body */ }
        if (!res.ok) throw Object.assign({ status: res.status }, data || { detail: res.statusText });
        return data;
      }

      function errText(e) {
        if (!e) return t("err_unknown");
        if (typeof e.detail === "string") return e.detail;
        if (Array.isArray(e.detail)) return e.detail.map(d => d.msg).join("; ");
        return String(e.message || e);
      }

      /* ================= DOM helpers ================= */
      const chat = document.getElementById("chat");
      const input = document.getElementById("input");
      const qbadge = document.getElementById("qbadge");
      const connBtn = document.getElementById("conn");
      const statusline = document.getElementById("statusline");

      function now() {
        const d = new Date();
        return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      }
      function esc(t) {
        return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function scroll() { chat.scrollTop = chat.scrollHeight; }
      function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

      function addMsg(side, html, opts) {
        opts = opts || {};
        const wrap = document.createElement("div");
        wrap.className = "msg " + side;
        const b = document.createElement("div");
        b.className = "bubble";
        if (opts.img) {
          const i = document.createElement("img");
          i.className = "photo";
          i.src = opts.img;
          i.alt = t("photo_alt");
          b.appendChild(i);
        }
        const t = document.createElement("div");
        t.innerHTML = html;
        b.appendChild(t);
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = "<span>" + now() + "</span>" + (side === "out" ? '<span class="ticks">✓✓</span>' : "");
        b.appendChild(meta);
        wrap.appendChild(b);
        chat.appendChild(wrap);
        scroll();
        return wrap;
      }

      function sysMsg(text) {
        const s = document.createElement("div");
        s.className = "sys";
        s.textContent = text;
        chat.appendChild(s);
        scroll();
      }

      function addTyping() {
        return addMsg("in", '<span class="dots"><i></i><i></i><i></i></span>');
      }

      async function agentSay(html, opts) {
        opts = opts || {};
        const t = addTyping();
        await delay(opts.fast ? 350 : 700);
        t.remove();
        addMsg("in", html);
      }

      // Shows the typing dots while a slow call (the OCR) runs.
      async function working(promise) {
        const t = addTyping();
        try { return await promise; } finally { t.remove(); }
      }

      function askButtons(list) {
        return new Promise(res => {
          const wrap = document.createElement("div");
          wrap.className = "btns";
          list.forEach(b => {
            const el = document.createElement("button");
            el.className = "qr";
            el.innerHTML = b.label;
            el.onclick = () => {
              document.querySelectorAll(".btns").forEach(e => e.remove());
              res(b.value);
            };
            wrap.appendChild(el);
          });
          chat.appendChild(wrap);
          scroll();
        });
      }

      function waitText() {
        return new Promise(res => { S.waiter = res; });
      }

      /* ================= Lifecycle chips ================= */
      const chipsBox = document.getElementById("chips");
      STATES.forEach((s, i) => {
        const c = document.createElement("span");
        c.className = "chip";
        c.dataset.i18n = s;
        c.textContent = t(s);
        chipsBox.appendChild(c);
        if (i < STATES.length - 1) {
          const sep = document.createElement("span");
          sep.className = "sep";
          sep.textContent = "→";
          chipsBox.appendChild(sep);
        }
      });

      function setState(s) {
        const chips = chipsBox.querySelectorAll(".chip");
        const idx = s ? STATES.indexOf(s) : -1;
        chips.forEach((c, i) => {
          c.className = "chip" + (idx >= 0 && i < idx ? " done" : i === idx ? " active" : "");
        });
      }

      async function refreshStatus() {
        let onPhone = 0;
        try { onPhone = await Outbox.count(); } catch (e) { /* storage blocked: counts as empty */ }
        let st = null;
        if (phoneOnline()) {
          try { st = await api("GET", "/status"); S.extractor = st.extractor; } catch (e) { /* shown below */ }
        }
        const ai = st ? st.counts.PENDING_AI : 0, sync = st ? st.counts.SAVED + st.counts.SYNC_FAILED : 0;
        const parts = [];
        if (onPhone) parts.push(t("q_phone", { n: onPhone }));
        if (ai) parts.push(t("q_ai", { n: ai }));
        if (sync) parts.push(t("q_sync", { n: sync }));
        qbadge.style.display = parts.length ? "inline-block" : "none";
        qbadge.textContent = "⏳ " + parts.join(" · ");
        updateConn();
        if (phoneOnline() && !st) statusline.textContent = t("st_server_down");
        return st;
      }

      /* ================= Connection toggle ================= */
      function updateConn() {
        const on = phoneOnline();
        connBtn.textContent = on ? t("conn_on") : t("conn_off");
        connBtn.className = on ? "" : "off";
        statusline.textContent = (on ? t("st_online") : t("st_offline")) +
          (S.extractor === "fixture" ? t("st_demo") : "");
      }
      // Demo switch: makes the phone behave as if it had no network (nothing is sent to the server).
      // Real network changes on the phone do the same thing on their own (online/offline events).
      connBtn.onclick = () => { S.simOffline = !S.simOffline; networkChanged(); };
      window.addEventListener("online", networkChanged);
      window.addEventListener("offline", networkChanged);

      // Called on every network change (real or simulated): going offline only updates the header,
      // coming back online sends the photos waiting on the phone.
      let lastOnline = null;
      async function networkChanged() {
        const on = phoneOnline();
        if (on === lastOnline) return;
        lastOnline = on;
        updateConn();
        if (!on) { sysMsg(t("sys_lost")); await refreshStatus(); return; }
        sysMsg(t("sys_back"));
        await sendOutbox();
      }

      /* Uploads every photo waiting on the phone (oldest first), runs the AI on them, then
         starts the review of the first one if the midwife isn't busy with another record. */
      async function sendOutbox() {
        clearTimeout(S.retryTimer);
        if (S.flushing || !phoneOnline()) return;
        S.flushing = true;
        try {
          const items = Outbox.ok ? await Outbox.list() : [];
          if (items.length) {
            if (!S.retrying) await agentSay(t("sending", { n: items.length }), { fast: true });
            for (const item of items) {
              if (S.uploading.has(item.id)) continue;
              let rec;
              try { rec = await uploadItem(item); }
              catch (e) {
                // Server unreachable: keep the photos, try again quietly in the background.
                if (!S.retrying) await agentSay(t("send_retry", { err: val(errText(e)) }), { fast: true });
                S.retrying = true;
                S.retryTimer = setTimeout(sendOutbox, 20000);
                await refreshStatus();
                return;
              }
              S.toReview.push(rec.id);
            }
            if (S.retrying) sysMsg(t("sys_sent"));
            S.retrying = false;
          }
          const st = await refreshStatus();
          if (st && st.counts.PENDING_AI > 0) {
            await agentSay(t("reading", { n: st.counts.PENDING_AI }), { fast: true });
            try { await working(api("POST", "/queue/process")); } catch (e) { await agentSay("⚠️ " + val(errText(e))); }
          }
          await syncNow();
        } finally { S.flushing = false; }
        if (!S.flowActive) await reviewNext();
      }

      // The phone's copy is deleted only after the server has answered that it stored the photo.
      async function uploadItem(item) {
        if (S.uploading.has(item.id)) throw { detail: t("err_sending") };
        S.uploading.add(item.id);
        try {
          const form = new FormData();
          form.append("photo", await Outbox.open(item), "page.jpg");
          form.append("midwife_id", item.midwife_id);
          form.append("captured_at", item.captured_at);
          const rec = await api("POST", "/records", form, true);
          await Outbox.remove(item.id);
          return rec;
        } finally { S.uploading.delete(item.id); }
      }

      // Review the pages that were uploaded from the phone's outbox, one at a time.
      async function reviewNext() {
        while (S.toReview.length) {
          const id = S.toReview.shift();
          let rec;
          try { rec = await api("GET", "/records/" + id); } catch (e) { S.toReview.unshift(id); return; }
          S.flowActive = true;
          S.rec = rec;
          if (S.toReview.length) sysMsg(t("sys_more", { n: S.toReview.length }));
          addMsg("in", t("page_taken", { when: val(when(new Date(rec.captured_at))) }));
          if (rec.state === "SUSPECTED_DUPLICATE") return askDuplicate(rec);
          return continueRecord(id);
        }
      }

      async function syncNow() {
        if (!phoneOnline()) return;
        const st = await refreshStatus();
        if (!st || st.counts.SAVED + st.counts.SYNC_FAILED === 0) return;
        let r;
        try { r = await working(api("POST", "/sync")); } catch (e) { return; }
        if (r.synced.length) {
          if (S.rec && r.synced.includes(S.rec.id)) setState("SYNCED");
          await agentSay(t("synced", { n: r.synced.length }), { fast: true });
        }
        if (r.waiting.length) await agentSay(t("wait_conn", { n: r.waiting.length }), { fast: true });
        await refreshStatus();
      }

      /* ================= Agent flows ================= */
      // A new photo: saved encrypted on the phone first, then sent right away if there is network,
      // otherwise left in the outbox (PENDING_AI) so the midwife can carry on photographing pages.
      async function startFromPhoto(dataUrl, shown) {
        S.flowActive = true;
        if (!shown) addMsg("out", t("caption_default"), { img: dataUrl });
        const blob = await (await fetch(dataUrl)).blob();
        let item = null;
        if (Outbox.ok) {
          try { item = await Outbox.add(blob, "mw-demo"); }
          catch (e) { await agentSay(t("save_failed", { err: esc(String(e && e.message || e)) })); }
        }
        if (!item && !phoneOnline()) {
          await agentSay(t("no_store"));
          S.flowActive = false;
          return;
        }
        setState("CAPTURED");
        if (item) await agentSay(t("saved_enc"), { fast: true });
        if (!phoneOnline()) {
          setState("PENDING_AI");
          await refreshStatus();
          await agentSay(t("kept_pending"));
          S.flowActive = false;
          setState(null);
          return;
        }
        let rec;
        try {
          if (item) rec = await uploadItem(item);
          else {
            const form = new FormData();
            form.append("photo", blob, "page.jpg");
            form.append("midwife_id", "mw-demo");
            rec = await api("POST", "/records", form, true);
          }
        } catch (e) {
          await refreshStatus();
          await agentSay("⚠️ " + val(errText(e)) + (item ? t("upload_kept") : ""));
          S.flowActive = false;
          return;
        }
        S.rec = rec;
        if (rec.state === "SUSPECTED_DUPLICATE") return askDuplicate(rec);
        setState("PENDING_AI");
        await continueRecord(rec.id);
      }

      // The server has seen this exact photo before: the midwife decides whether to process it again.
      async function askDuplicate(rec) {
        S.flowActive = true;
        S.rec = rec;
        setState("CAPTURED");
        await agentSay(t("dup_q"));
        const c = await askButtons([
          { label: t("dup_yes"), value: "go" },
          { label: t("dup_no"), value: "drop" }
        ]);
        if (c === "drop") { await agentSay(t("dup_dropped"), { fast: true }); return finish(); }
        try { rec = await api("POST", "/records/" + rec.id + "/retry"); }
        catch (e) { await agentSay("⚠️ " + val(errText(e))); return finish(); }
        S.rec = rec;
        setState("PENDING_AI");
        await continueRecord(rec.id);
      }

      async function continueRecord(id) {
        try {
          await working(api("POST", "/queue/process"));
          S.rec = await api("GET", "/records/" + id);
        } catch (e) { await agentSay("⚠️ " + val(errText(e))); return; }
        await refreshStatus();
        const rec = S.rec;
        if (rec.state === "PENDING_AI") {
          await agentSay(t("still_waiting", { why: rec.last_error ? val(rec.last_error) : t("will_retry") }));
          return;
        }
        if (rec.state === "PROCESSING_FAILED") {
          await agentSay(t("cant_read", { why: rec.last_error ? " (<span class='mut'>" + val(rec.last_error) + "</span>)" : "" }));
          return retakeOrManual();
        }
        if (rec.state === "MANUAL_REVIEW_REQUIRED") {
          await agentSay(t("unknown_page"));
          return retakeOrManual();
        }
        setState("AI_PROCESSED");
        await agentSay(summaryHtml(rec), { fast: true });
        setState("TO_REVIEW");
        await reviewQuestions();
      }

      async function retakeOrManual() {
        const c = await askButtons([
          { label: t("b_retake"), value: "retake" },
          { label: t("b_manual"), value: "manual" }
        ]);
        if (c === "retake") {
          S.awaitingPhoto = true;
          await agentSay(t("retake"));
          return;
        }
        const pages = ["cover", "identification", "current_pregnancy", "delivery", "postpartum_early_mother",
                       "postpartum_early_newborn", "postpartum_late_mother", "postpartum_late_newborn"];
        await agentSay(t("which_page"), { fast: true });
        const p = await askButtons(pages.map(x => ({ label: esc(pageName(x)), value: x })));
        try { S.rec = await api("POST", "/records/" + S.rec.id + "/manual", { page_type: p }); }
        catch (e) { await agentSay("⚠️ " + val(errText(e))); return; }
        await agentSay(t("manual_ok", { np: esc(stName("NOT_PROVIDED")) }), { fast: true });
        S.rec.state = "MANUAL_REVIEW_REQUIRED";
        await reviewMenu();
      }

      function flag(f) {
        if (f.status === "UNKNOWN") return "◻️ " + esc(stName("UNKNOWN"));
        if (f.status === "NOT_APPLICABLE") return "— " + esc(stName("NOT_APPLICABLE"));
        if (f.status === "NEEDS_REVIEW") return "⚠️ " + esc(stName("NEEDS_REVIEW"));
        if (f.status === "ILLEGIBLE") return "❓ " + esc(stName("ILLEGIBLE"));
        return f.corrected_by_midwife ? "✏️" : "✅";
      }

      function summaryHtml(rec) {
        const shown = rec.filled.slice(0, 8).map(f =>
          "• " + val(lbl(f)) + ": <b>" + val(f.display ?? "—") + "</b> " + flag(f) +
          " · " + t("conf") + " " + val(Number(f.confidence).toFixed(2))).join("<br>");
        const more = rec.filled.length > 8 ? "<br><span class='mut'>" + t("more_filled", { n: rec.filled.length - 8 }) + "</span>" : "";
        const counts = Object.entries(rec.summary || {}).map(([k, v]) => v + " " + stName(k)).join(" · ");
        const quality = rec.image_quality && rec.image_quality.issues && rec.image_quality.issues.length
          ? "<br>" + t("photo_issues") + val(rec.image_quality.issues.join(", ")) : "";
        const page = I18N.en[rec.page_type] ? pageName(rec.page_type) : rec.page_type_label || rec.page_type;
        return "📋 <b>" + esc(page) + "</b><br>" + shown + more +
               "<br><span class='mut'>" + esc(counts) + quality + "</span>" +
               '<br><span class="mut">' + t("no_ids") + "</span>";
      }

      async function sendAnswers(answers) {
        try {
          S.rec = await api("PATCH", "/records/" + S.rec.id + "/fields", { answers });
          return true;
        } catch (e) { await agentSay("⚠️ " + val(errText(e))); return false; }
      }

      async function askOne(f) {
        const seen = f.display != null && f.display !== "" ? t("i_read", { v: val(f.display) }) : t("cant_field");
        const why = f.issues && f.issues.length ? " <span class='mut'>" + val("(" + f.issues.join("; ") + ")") + "</span>" : "";
        await agentSay("⚠️ <b>" + val(lbl(f)) + "</b>:" + seen + " — " + t("confidence") + " " + val(Number(f.confidence).toFixed(2)) + why +
                       "<br><span class='mut'>" + question(f) + "</span>");
        const opts = [];
        if (f.display != null && f.display !== "") opts.push({ label: t("b_right"), value: "confirm" });
        opts.push({ label: t("b_type"), value: "type" }, { label: t("b_unknown"), value: "unknown" },
                  { label: t("b_skip"), value: "skip" });
        const c = await askButtons(opts);
        if (c === "skip") return;
        if (c === "confirm") return sendAnswers({ [f.key]: { confirm: true } });
        if (c === "unknown") {
          if (await sendAnswers({ [f.key]: { status: "UNKNOWN" } }))
            await agentSay(t("marked_unknown", { st: esc(stName("UNKNOWN")) }), { fast: true });
          return;
        }
        await agentSay(t("type_for", { label: val(lbl(f)) }), { fast: true });
        await typeUntilAccepted(f.key, lbl(f));
      }

      // Keeps asking until the server accepts the value (a date must be a date, Pos/Neg must be Pos/Neg...).
      async function typeUntilAccepted(key, label) {
        for (;;) {
          const v = await waitText();
          if (await sendAnswers({ [key]: { text: v } })) {
            const nf = (await api("GET", "/records/" + S.rec.id)).fields[key];
            await agentSay(val(label) + " = <b>" + val(nf.display ?? v) + "</b> ✓ <span class='mut'>" + t("by_midwife") + "</span>", { fast: true });
            return;
          }
          await agentSay(t("try_again"), { fast: true });
        }
      }

      async function reviewQuestions() {
        const queue = S.rec.needs_review.slice();
        if (!queue.length) {
          await agentSay(t("all_ok"), { fast: true });
          return reviewMenu();
        }
        await agentSay(t("need_eyes", { n: queue.length }), { fast: true });
        for (const f of queue.slice(0, ASK_FIRST)) await askOne(f);
        const rest = S.rec.needs_review.filter(f => !queue.slice(0, ASK_FIRST).some(q => q.key === f.key));
        if (rest.length) {
          await agentSay(t("more_flagged", { n: rest.length }));
          const c = await askButtons([
            { label: t("b_all"), value: "all" },
            { label: t("b_as_read"), value: "confirm" },
            { label: t("b_leave"), value: "leave" }
          ]);
          if (c === "all") for (const f of rest) await askOne(f);
          else if (c === "confirm") {
            const ans = {};
            rest.forEach(f => { ans[f.key] = f.display ? { confirm: true } : { status: "ILLEGIBLE" }; });
            await sendAnswers(ans);
          }
        }
        await reviewMenu();
      }

      async function reviewMenu() {
        const c = await askButtons([
          { label: t("b_confirm_all"), value: "confirm" },
          { label: t("b_correct"), value: "correct" },
          { label: t("b_retake"), value: "retake" }
        ]);
        if (c === "retake") {
          S.awaitingPhoto = true;
          await agentSay(t("retake2"));
          return;
        }
        if (c === "correct") return correctField();
        try {
          if (S.rec.state === "MANUAL_REVIEW_REQUIRED") { await agentSay(t("enter_first"), { fast: true }); return reviewMenu(); }
          S.rec = await api("POST", "/records/" + S.rec.id + "/validate");
        } catch (e) { await agentSay("⚠️ " + val(errText(e))); return reviewMenu(); }
        setState("VALIDATED");
        await agentSay(t("validated"), { fast: true });
        linking();
      }

      async function correctField() {
        const full = await api("GET", "/records/" + S.rec.id);
        const all = Object.values(full.fields);
        await agentSay(t("field_search"), { fast: true });
        const q = (await waitText()).toLowerCase();
        const hits = all.filter(f => (f.label_en + " " + f.label_fr + " " + f.key).toLowerCase().includes(q)).slice(0, 8);
        if (!hits.length) {
          await agentSay(t("no_match", { q: esc(q) }), { fast: true });
          return reviewMenu();
        }
        const k = await askButtons(hits.map(f => ({
          label: val(lbl(f)) + (f.key.includes(".") ? " <span class='mut'>(<bdi>" + esc(f.key) + "</bdi>)</span>" : ""), value: f.key })));
        const f = full.fields[k];
        await agentSay(t("send_correct", { label: val(lbl(f)), now: f.display ? t("now", { v: val(f.display) }) : "" }), { fast: true });
        await typeUntilAccepted(k, lbl(f));
        reviewMenu();
      }

      function patientCard(p) {
        const last = p.last_visit ? when(new Date(p.last_visit), true) : "—";
        const near = p.distance > 0 ? " <span class='mut'>" + t("one_char") + "</span>" : "";
        return '<div class="pcard"><b>👤 ' + val(p.code) + "</b>" + near + "<br>" + t("on_file", { n: p.visits }) + " · " +
               esc((p.pages || []).map(pageName).join(", ") || "—") + '<br><span class="mut">' + t("last_visit") + " " + val(last) + "</span></div>";
      }

      async function link(code, create) {
        try {
          S.rec = await api("POST", "/records/" + S.rec.id + "/link", { patient_code: code, create });
        } catch (e) { await agentSay("⚠️ " + val(errText(e))); return false; }
        setState("PATIENT_LINKED");
        await delay(250);
        setState("SAVED");
        return true;
      }

      async function linking() {
        const opts = [];
        if (S.rec.record_number) {
          await agentSay(t("page_code", { code: val(S.rec.record_number) }), { fast: true });
          opts.push({ label: t("b_use", { code: val(S.rec.record_number) }), value: "page" });
        }
        opts.push({ label: t("b_have_code"), value: "code" }, { label: t("b_new_patient"), value: "new" });
        const c = await askButtons(opts);
        if (c === "new") {
          const { code } = await api("GET", "/patients/new-code");
          if (await link(code, true))
            await agentSay(t("created", { code: val(code) }), { fast: true });
          return finish();
        }
        let code = S.rec.record_number;
        if (c === "code") {
          await agentSay(t("send_code"), { fast: true });
          code = await waitText();
        }
        let matches = [];
        try { matches = await api("GET", "/patients?code=" + encodeURIComponent(code)); }
        catch (e) { await agentSay("⚠️ " + val(errText(e))); return linking(); }
        if (!matches.length) {
          await agentSay(t("no_profile", { code: val(code) }), { fast: true });
          const m = await askButtons([
            { label: t("b_create"), value: "create" },
            { label: t("b_again"), value: "again" },
            { label: t("b_unsure"), value: "unsure" }
          ]);
          if (m === "create") {
            if (await link(code, true))
              await agentSay(t("created", { code: val(code) }), { fast: true });
            return finish();
          }
          if (m === "again") return linking();
          await agentSay(t("unlinked"), { fast: true });
          return finish();
        }
        await agentSay(t("n_match", { n: matches.length }), { fast: true });
        matches.forEach(p => addMsg("in", patientCard(p)));
        const btns = matches.map(p => ({ label: t("b_link", { code: val(p.code) }), value: p.code }));
        btns.push({ label: t("b_none"), value: "none" }, { label: t("b_unsure"), value: "unsure" });
        const m = await askButtons(btns);
        if (m === "unsure") {
          await agentSay(t("unlinked"), { fast: true });
          return finish();
        }
        if (m === "none") {
          const { code: fresh } = await api("GET", "/patients/new-code");
          if (await link(fresh, true))
            await agentSay(t("created", { code: val(fresh) }), { fast: true });
          return finish();
        }
        if (await link(m, false))
          await agentSay(t("linked", { code: val(m) }), { fast: true });
        return finish();
      }

      // End of one record: sync, then the next page sent from the phone, or a new visit.
      async function finish() {
        await syncNow();
        const opts = [{ label: t("b_new_visit"), value: "new" }];
        if (S.toReview.length) opts.unshift({ label: t("b_next", { n: S.toReview.length }), value: "next" });
        const c = await askButtons(opts);
        if (c === "next") { sysMsg(t("sys_next")); S.flowActive = false; S.rec = null; setState(null); return reviewNext(); }
        if (c === "new") reset();
      }

      function reset() {
        S.flowActive = false;
        S.awaitingPhoto = false;
        S.waiter = null;
        S.rec = null;
        setState(null);
        sysMsg(t("sys_new"));
        refreshStatus();
        greeting();
      }

      async function greeting() {
        await agentSay(t("hello"), { fast: true });
        await agentSay(t("hello2"));
        if (!Outbox.ok)
          await agentSay(t("insecure"), { fast: true });
      }

      /* ================= Language picker =================
         New messages use the new language right away; messages already in the chat stay as they
         were (like a real chat). Before any record is started, the greeting is shown again. */
      document.getElementById("lang").addEventListener("change", e => {
        LANG = LANGS[e.target.value] ? e.target.value : "en";
        try { localStorage.setItem("dayone.lang", LANG); } catch (err) { /* not remembered */ }
        applyLang();
        updateConn();
        refreshStatus();
        if (!S.flowActive && !S.awaitingPhoto && !S.waiter) {
          chat.innerHTML = "";
          greeting();
        } else {
          sysMsg(t("lang_set"));
        }
      });

      /* ================= Image preview & send ================= */
      const preview = document.getElementById("preview");
      const pimg = document.getElementById("pimg");
      const pcaption = document.getElementById("pcaption");
      let pendingImage = null;

      function showPreview(dataUrl) {
        pendingImage = dataUrl;
        pimg.src = dataUrl;
        pcaption.value = "";
        preview.style.display = "flex";
        pcaption.focus();
        scroll();
      }
      function clearPreview() {
        pendingImage = null;
        preview.style.display = "none";
      }
      document.getElementById("pclear").onclick = clearPreview;
      document.getElementById("psend").onclick = () => sendPendingImage();
      pcaption.addEventListener("keydown", e => { if (e.key === "Enter") sendPendingImage(); });

      function sendPendingImage() {
        if (!pendingImage) return;
        const cap = pcaption.value.trim() || input.value.trim() || t("caption_default");
        const url = pendingImage;
        clearPreview();
        input.value = "";
        addMsg("out", esc(cap), { img: url });
        onPhoto(url, true);
      }

      /* ================= User input ================= */
      function sendText() {
        if (pendingImage) { sendPendingImage(); return; }
        const v = input.value.trim();
        if (!v) return;
        input.value = "";
        addMsg("out", esc(v));
        if (v.toLowerCase() === "/new") { reset(); return; }
        if (S.waiter) {
          const w = S.waiter;
          S.waiter = null;
          w(v);
          return;
        }
        if (S.flowActive && !S.awaitingPhoto) {
          agentSay(t("tap_button"), { fast: true });
        } else if (S.awaitingPhoto) {
          agentSay(t("want_photo"), { fast: true });
        } else {
          agentSay(t("intro"), { fast: true });
        }
      }

      function onPhoto(dataUrl, shown) {
        if (S.awaitingPhoto) {
          S.awaitingPhoto = false;
          startFromPhoto(dataUrl, shown);
          return;
        }
        if (S.flowActive) {
          agentSay(t("busy"), { fast: true });
          return;
        }
        startFromPhoto(dataUrl, shown);
      }

      document.getElementById("send").onclick = sendText;
      input.addEventListener("keydown", e => { if (e.key === "Enter") sendText(); });
      document.getElementById("attach").onclick = () => document.getElementById("file").click();
      document.getElementById("file").addEventListener("change", e => {
        const f = e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => showPreview(r.result);
        r.readAsDataURL(f);
        e.target.value = "";
      });

      /* ================= Init ================= */
      if ("serviceWorker" in navigator && window.isSecureContext)
        navigator.serviceWorker.register("/sw.js").catch(e => console.warn("offline page cache unavailable:", e));
      applyLang();
      lastOnline = phoneOnline();
      updateConn();
      refreshStatus();
      greeting().then(() => { if (phoneOnline()) sendOutbox(); });
    </script>
  </body>
</html>
