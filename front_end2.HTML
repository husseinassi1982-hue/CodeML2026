<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#075e54" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>DayOne Agent — WhatsApp prototype</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: "Segoe UI", Helvetica, system-ui, sans-serif;
        background: #1b2a33;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .phone {
        width: 100%;
        max-width: 430px;
        height: 92vh;
        min-height: 620px;
        display: flex;
        flex-direction: column;
        background: #ece5dd;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55);
      }

      /* ===== Header ===== */
      header {
        background: #075e54;
        color: #fff;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .avatar {
        width: 38px; height: 38px;
        border-radius: 50%;
        background: #25d366;
        display: flex; align-items: center; justify-content: center;
        font-size: 19px;
        flex-shrink: 0;
      }
      .hname { font-weight: 600; font-size: 15px; }
      .hstatus { font-size: 11px; opacity: 0.85; }
      #conn {
        margin-left: auto;
        border: none;
        border-radius: 14px;
        padding: 5px 10px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        color: #053a30;
        background: #a5f0c5;
      }
      #conn.off { background: #f6c9a8; color: #5a2c0b; }

      /* ===== Status strip (record lifecycle) ===== */
      .strip {
        background: #074a43;
        color: #cfe9e2;
        font-size: 10px;
        padding: 6px 10px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }
      .chip {
        background: rgba(255, 255, 255, 0.12);
        padding: 2px 6px;
        border-radius: 8px;
        white-space: nowrap;
      }
      .chip.done { background: rgba(37, 211, 102, 0.4); color: #eafff3; }
      .chip.active { background: #25d366; color: #05312a; font-weight: 700; }
      .sep { opacity: 0.4; }
      #qbadge {
        margin-left: auto;
        background: #b7791f;
        color: #fff;
        padding: 2px 8px;
        border-radius: 8px;
        font-weight: 700;
        display: none;
      }
      .lock {
        width: 100%;
        opacity: 0.65;
        font-size: 9px;
        padding-top: 2px;
      }

      /* ===== Chat area ===== */
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 14px 10px 6px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        background-color: #ece5dd;
        background-image: radial-gradient(rgba(0, 0, 0, 0.045) 1.5px, transparent 1.5px);
        background-size: 20px 20px;
      }

      .msg { display: flex; }
      .msg.in { justify-content: flex-start; }
      .msg.out { justify-content: flex-end; }

      .bubble {
        position: relative;
        max-width: 82%;
        padding: 7px 10px 16px;
        border-radius: 10px;
        font-size: 13.5px;
        line-height: 1.45;
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.14);
        word-wrap: break-word;
        animation: pop 0.18s ease-out;
      }
      @keyframes pop {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      .msg.in .bubble { background: #fff; border-top-left-radius: 2px; }
      .msg.out .bubble { background: #d9fdd3; border-top-right-radius: 2px; }

      .meta {
        position: absolute;
        right: 8px; bottom: 3px;
        font-size: 9.5px;
        color: #8a9291;
        display: flex; gap: 3px; align-items: center;
      }
      .ticks { color: #34b7f1; font-size: 10px; }

      .photo {
        display: block;
        max-width: 210px;
        width: 100%;
        border-radius: 7px;
        margin-bottom: 4px;
      }

      .mut { color: #6b7472; font-size: 11.5px; }
      .pcard {
        background: #f4f6f7;
        border-left: 3px solid #25d366;
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 12.5px;
      }

      /* typing indicator */
      .dots { display: inline-flex; gap: 4px; padding: 4px 2px; }
      .dots i {
        width: 7px; height: 7px;
        background: #9aa5a3;
        border-radius: 50%;
        animation: blink 1.1s infinite;
      }
      .dots i:nth-child(2) { animation-delay: 0.2s; }
      .dots i:nth-child(3) { animation-delay: 0.4s; }
      @keyframes blink { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }

      .sys {
        align-self: center;
        background: #fdf3c4;
        color: #5c5433;
        font-size: 11px;
        padding: 4px 12px;
        border-radius: 9px;
        margin: 2px 0;
      }

      /* ===== Quick-reply buttons ===== */
      .btns {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-self: flex-start;
        max-width: 82%;
        margin-bottom: 6px;
      }
      .qr {
        background: #fff;
        border: 1px solid #ddd;
        color: #0084ff;
        font-size: 13px;
        padding: 8px 14px;
        border-radius: 16px;
        cursor: pointer;
        text-align: left;
        animation: pop 0.18s ease-out;
        transition: background 0.15s;
      }
      .qr:hover { background: #f0f8ff; }

      /* ===== Image preview bar ===== */
      #preview {
        display: none;
        align-items: center;
        gap: 8px;
        background: #e6ded4;
        padding: 8px;
        border-top: 1px solid rgba(0, 0, 0, 0.08);
      }
      #preview img {
        width: 54px;
        height: 54px;
        object-fit: cover;
        border-radius: 7px;
      }
      #pcaption {
        flex: 1;
        border: none;
        border-radius: 16px;
        padding: 9px 14px;
        font-size: 13px;
        outline: none;
      }
      #psend {
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 50%;
        background: #25d366;
        color: #fff;
        font-size: 17px;
        cursor: pointer;
        flex-shrink: 0;
      }
      #pclear {
        width: 34px;
        height: 34px;
        border: none;
        border-radius: 50%;
        background: #fff;
        color: #d34545;
        font-size: 14px;
        cursor: pointer;
        flex-shrink: 0;
      }

      /* ===== Composer ===== */
      .composer {
        background: #f0f0f0;
        padding: 8px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .cbtn {
        width: 40px; height: 40px;
        border-radius: 50%;
        border: none;
        background: #fff;
        font-size: 18px;
        cursor: pointer;
        flex-shrink: 0;
        color: #444;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
      }
      .cbtn:hover { background: #f0f8ff; }
      #input {
        flex: 1;
        border: none;
        border-radius: 20px;
        padding: 10px 16px;
        font-size: 14px;
        outline: none;
        background: #fff;
      }
      #send { background: #25d366; color: #fff; }
    </style>
  </head>
  <body>
    <div class="phone">
      <header>
        <div class="avatar">🩺</div>
        <div>
          <div class="hname">DayOne Agent</div>
          <div class="hstatus" id="statusline">online</div>
        </div>
        <button id="conn">📶 Online</button>
      </header>

      <div class="strip">
        <div id="chips" style="display: contents"></div>
        <span id="qbadge"></span>
        <div class="lock" id="lock">🔒 Photos kept encrypted on this phone until sent · names &amp; identifiers never stored · paper registry stays the reference</div>
      </div>

      <div id="chat"></div>

      <div id="preview">
        <img id="pimg" alt="selected registry page preview" />
        <input id="pcaption" placeholder="Caption (optional)…" autocomplete="off" />
        <button id="psend" title="Send photo">➤</button>
        <button id="pclear" title="Remove">✕</button>
      </div>

      <div class="composer">
        <button class="cbtn" id="attach" title="Send a registry photo">📎</button>
        <input id="input" placeholder="Type a message…" autocomplete="off" />
        <button class="cbtn" id="send" title="Send">➤</button>
        <input type="file" id="file" accept="image/*" hidden />
      </div>
    </div>

    <script>
      /* DayOne chat, wired to the real backend (backend/main.py).
         Opened from http://localhost:8000 it talks to the same server; opened from disk
         (file://) it talks to http://localhost:8000. No demo data: every field, status,
         confidence and patient suggestion comes from the API.

         Offline-first on the phone: the page itself is cached by a service worker (pwa/sw.js),
         and every photo is first saved ENCRYPTED on the phone (Outbox below). It is uploaded to
         the processing server when the phone has network, and deleted from the phone only once
         the server confirms it has it. With no network the midwife can keep photographing pages. */
      const API = location.protocol === "file:" ? "http://localhost:8000" : "";

      /* Record lifecycle as defined by the backend (offline.State) */
      const STATES = ["CAPTURED", "PENDING_AI", "AI_PROCESSED", "TO_REVIEW", "VALIDATED", "PATIENT_LINKED", "SAVED", "SYNCED"];
      const ASK_FIRST = 5; // review questions asked one by one before offering a shortcut

      const S = { simOffline: false, extractor: "?", flowActive: false, awaitingPhoto: false,
                  waiter: null, rec: null, toReview: [], flushing: false, uploading: new Set(), retryTimer: null, retrying: false };

      // The phone has network if the OS says so and the demo switch is not set to offline.
      function phoneOnline() { return navigator.onLine && !S.simOffline; }

      /* ================= Phone-side offline store =================
         Photos wait here, encrypted with AES-GCM (WebCrypto). The key is generated on the phone
         and is not exportable: the page can use it, nothing can read it out. Needs a secure page
         (https://, or http://localhost); see README "Phone setup". */
      const Outbox = (() => {
        const ok = !!(window.isSecureContext && window.crypto && crypto.subtle && window.indexedDB);
        let dbp = null, keyp = null;
        function db() {
          return dbp = dbp || new Promise((res, rej) => {
            const r = indexedDB.open("dayone", 1);
            r.onupgradeneeded = () => {
              r.result.createObjectStore("keys");
              r.result.createObjectStore("outbox", { keyPath: "id" });
            };
            r.onsuccess = () => res(r.result);
            r.onerror = () => rej(r.error);
          });
        }
        async function tx(store, mode, fn) {
          const d = await db();
          return new Promise((res, rej) => {
            const t = d.transaction(store, mode);
            const req = fn(t.objectStore(store));
            t.oncomplete = () => res(req.result);
            t.onerror = t.onabort = () => rej(t.error);
          });
        }
        function key() {
          return keyp = keyp || (async () => {
            const k = await tx("keys", "readonly", st => st.get("photo"));
            if (k) return k;
            const fresh = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
            await tx("keys", "readwrite", st => st.put(fresh, "photo"));
            return fresh;
          })();
        }
        async function add(blob, midwife_id) {
          const iv = crypto.getRandomValues(new Uint8Array(12));
          const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await key(), await blob.arrayBuffer());
          const item = { id: crypto.randomUUID(), iv, data, type: blob.type || "image/jpeg",
                         captured_at: new Date().toISOString(), midwife_id };
          await tx("outbox", "readwrite", st => st.put(item));
          return item;
        }
        async function list() {
          const all = await tx("outbox", "readonly", st => st.getAll());
          return all.sort((a, b) => a.captured_at.localeCompare(b.captured_at));
        }
        async function open(item) {
          const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: item.iv }, await key(), item.data);
          return new Blob([plain], { type: item.type });
        }
        function remove(id) { return tx("outbox", "readwrite", st => st.delete(id)); }
        async function count() { return ok ? (await list()).length : 0; }
        return { ok, add, list, open, remove, count };
      })();

      /* ================= API ================= */
      async function api(method, path, body, isForm) {
        if (!phoneOnline()) throw { offline: true, detail: "No connection — try again when the network is back." };
        let res;
        try {
          res = await fetch(API + path, {
            method,
            headers: isForm || !body ? {} : { "Content-Type": "application/json" },
            body: isForm ? body : body ? JSON.stringify(body) : undefined
          });
        } catch (e) {
          throw { offline: true, detail: "Can't reach the DayOne server. Is it running? (cd backend && uvicorn main:app)" };
        }
        let data = null;
        try { data = await res.json(); } catch (e) { /* no body */ }
        if (!res.ok) throw Object.assign({ status: res.status }, data || { detail: res.statusText });
        return data;
      }

      function errText(e) {
        if (!e) return "unknown error";
        if (typeof e.detail === "string") return e.detail;
        if (Array.isArray(e.detail)) return e.detail.map(d => d.msg).join("; ");
        return String(e.message || e);
      }

      /* ================= DOM helpers ================= */
      const chat = document.getElementById("chat");
      const input = document.getElementById("input");
      const qbadge = document.getElementById("qbadge");
      const connBtn = document.getElementById("conn");
      const statusline = document.getElementById("statusline");

      function now() {
        const d = new Date();
        return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      }
      function esc(t) {
        return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function scroll() { chat.scrollTop = chat.scrollHeight; }
      function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

      function addMsg(side, html, opts) {
        opts = opts || {};
        const wrap = document.createElement("div");
        wrap.className = "msg " + side;
        const b = document.createElement("div");
        b.className = "bubble";
        if (opts.img) {
          const i = document.createElement("img");
          i.className = "photo";
          i.src = opts.img;
          i.alt = "registry page photo";
          b.appendChild(i);
        }
        const t = document.createElement("div");
        t.innerHTML = html;
        b.appendChild(t);
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = "<span>" + now() + "</span>" + (side === "out" ? '<span class="ticks">✓✓</span>' : "");
        b.appendChild(meta);
        wrap.appendChild(b);
        chat.appendChild(wrap);
        scroll();
        return wrap;
      }

      function sysMsg(text) {
        const s = document.createElement("div");
        s.className = "sys";
        s.textContent = text;
        chat.appendChild(s);
        scroll();
      }

      function addTyping() {
        return addMsg("in", '<span class="dots"><i></i><i></i><i></i></span>');
      }

      async function agentSay(html, opts) {
        opts = opts || {};
        const t = addTyping();
        await delay(opts.fast ? 350 : 700);
        t.remove();
        addMsg("in", html);
      }

      // Shows the typing dots while a slow call (the OCR) runs.
      async function working(promise) {
        const t = addTyping();
        try { return await promise; } finally { t.remove(); }
      }

      function askButtons(list) {
        return new Promise(res => {
          const wrap = document.createElement("div");
          wrap.className = "btns";
          list.forEach(b => {
            const el = document.createElement("button");
            el.className = "qr";
            el.innerHTML = b.label;
            el.onclick = () => {
              document.querySelectorAll(".btns").forEach(e => e.remove());
              res(b.value);
            };
            wrap.appendChild(el);
          });
          chat.appendChild(wrap);
          scroll();
        });
      }

      function waitText() {
        return new Promise(res => { S.waiter = res; });
      }

      /* ================= Lifecycle chips ================= */
      const chipsBox = document.getElementById("chips");
      STATES.forEach((s, i) => {
        const c = document.createElement("span");
        c.className = "chip";
        c.textContent = s;
        chipsBox.appendChild(c);
        if (i < STATES.length - 1) {
          const sep = document.createElement("span");
          sep.className = "sep";
          sep.textContent = "→";
          chipsBox.appendChild(sep);
        }
      });

      function setState(s) {
        const chips = chipsBox.querySelectorAll(".chip");
        const idx = s ? STATES.indexOf(s) : -1;
        chips.forEach((c, i) => {
          c.className = "chip" + (idx >= 0 && i < idx ? " done" : i === idx ? " active" : "");
        });
      }

      async function refreshStatus() {
        let onPhone = 0;
        try { onPhone = await Outbox.count(); } catch (e) { /* storage blocked: counts as empty */ }
        let st = null;
        if (phoneOnline()) {
          try { st = await api("GET", "/status"); S.extractor = st.extractor; } catch (e) { /* shown below */ }
        }
        const ai = st ? st.counts.PENDING_AI : 0, sync = st ? st.counts.SAVED + st.counts.SYNC_FAILED : 0;
        const parts = [];
        if (onPhone) parts.push("📱 " + onPhone + " on phone");
        if (ai) parts.push(ai + " AI");
        if (sync) parts.push(sync + " sync");
        qbadge.style.display = parts.length ? "inline-block" : "none";
        qbadge.textContent = "⏳ " + parts.join(" · ");
        updateConn();
        if (phoneOnline() && !st) statusline.textContent = "⚠️ server not reachable — photos stay on the phone";
        return st;
      }

      /* ================= Connection toggle ================= */
      function updateConn() {
        const on = phoneOnline();
        connBtn.textContent = on ? "📶 Online" : "✈️ Offline";
        connBtn.className = on ? "" : "off";
        statusline.textContent = (on ? "online" : "offline — photos kept on this phone") +
          (S.extractor === "fixture" ? " · demo extractor" : "");
      }
      // Demo switch: makes the phone behave as if it had no network (nothing is sent to the server).
      // Real network changes on the phone do the same thing on their own (online/offline events).
      connBtn.onclick = () => { S.simOffline = !S.simOffline; networkChanged(); };
      window.addEventListener("online", networkChanged);
      window.addEventListener("offline", networkChanged);

      // Called on every network change (real or simulated): going offline only updates the header,
      // coming back online sends the photos waiting on the phone.
      let lastOnline = null;
      async function networkChanged() {
        const on = phoneOnline();
        if (on === lastOnline) return;
        lastOnline = on;
        updateConn();
        if (!on) { sysMsg("✈️ Connection lost — photos will be kept on this phone"); await refreshStatus(); return; }
        sysMsg("📶 Connection restored");
        await sendOutbox();
      }

      /* Uploads every photo waiting on the phone (oldest first), runs the AI on them, then
         starts the review of the first one if the midwife isn't busy with another record. */
      async function sendOutbox() {
        clearTimeout(S.retryTimer);
        if (S.flushing || !phoneOnline()) return;
        S.flushing = true;
        try {
          const items = Outbox.ok ? await Outbox.list() : [];
          if (items.length) {
            if (!S.retrying) await agentSay("📤 Sending " + items.length + " photo(s) saved on this phone…", { fast: true });
            for (const item of items) {
              if (S.uploading.has(item.id)) continue;
              let rec;
              try { rec = await uploadItem(item); }
              catch (e) {
                // Server unreachable: keep the photos, try again quietly in the background.
                if (!S.retrying) await agentSay("⚠️ " + esc(errText(e)) + " — the photos stay on the phone, I'll keep trying.", { fast: true });
                S.retrying = true;
                S.retryTimer = setTimeout(sendOutbox, 20000);
                await refreshStatus();
                return;
              }
              S.toReview.push(rec.id);
            }
            if (S.retrying) sysMsg("📤 Photos saved on the phone have been sent");
            S.retrying = false;
          }
          const st = await refreshStatus();
          if (st && st.counts.PENDING_AI > 0) {
            await agentSay("Reading " + st.counts.PENDING_AI + " page(s)…", { fast: true });
            try { await working(api("POST", "/queue/process")); } catch (e) { await agentSay("⚠️ " + esc(errText(e))); }
          }
          await syncNow();
        } finally { S.flushing = false; }
        if (!S.flowActive) await reviewNext();
      }

      // The phone's copy is deleted only after the server has answered that it stored the photo.
      async function uploadItem(item) {
        if (S.uploading.has(item.id)) throw { detail: "already being sent" };
        S.uploading.add(item.id);
        try {
          const form = new FormData();
          form.append("photo", await Outbox.open(item), "page.jpg");
          form.append("midwife_id", item.midwife_id);
          form.append("captured_at", item.captured_at);
          const rec = await api("POST", "/records", form, true);
          await Outbox.remove(item.id);
          return rec;
        } finally { S.uploading.delete(item.id); }
      }

      // Review the pages that were uploaded from the phone's outbox, one at a time.
      async function reviewNext() {
        while (S.toReview.length) {
          const id = S.toReview.shift();
          let rec;
          try { rec = await api("GET", "/records/" + id); } catch (e) { S.toReview.unshift(id); return; }
          S.flowActive = true;
          S.rec = rec;
          if (S.toReview.length) sysMsg(S.toReview.length + " more page(s) waiting after this one");
          addMsg("in", "📋 Page photographed " + esc(new Date(rec.captured_at).toLocaleString()) + ":");
          if (rec.state === "SUSPECTED_DUPLICATE") return askDuplicate(rec);
          return continueRecord(id);
        }
      }

      async function syncNow() {
        if (!phoneOnline()) return;
        const st = await refreshStatus();
        if (!st || st.counts.SAVED + st.counts.SYNC_FAILED === 0) return;
        let r;
        try { r = await working(api("POST", "/sync")); } catch (e) { return; }
        if (r.synced.length) {
          if (S.rec && r.synced.includes(S.rec.id)) setState("SYNCED");
          await agentSay("📤 " + r.synced.length + " record(s) <b>SYNCED</b> to the health system ✅", { fast: true });
        }
        if (r.waiting.length) await agentSay("📴 " + r.waiting.length + " record(s) waiting for the connection.", { fast: true });
        await refreshStatus();
      }

      /* ================= Agent flows ================= */
      // A new photo: saved encrypted on the phone first, then sent right away if there is network,
      // otherwise left in the outbox (PENDING_AI) so the midwife can carry on photographing pages.
      async function startFromPhoto(dataUrl, shown) {
        S.flowActive = true;
        if (!shown) addMsg("out", "Registry page 📸", { img: dataUrl });
        const blob = await (await fetch(dataUrl)).blob();
        let item = null;
        if (Outbox.ok) {
          try { item = await Outbox.add(blob, "mw-demo"); }
          catch (e) { await agentSay("⚠️ Couldn't save the photo on this phone (" + esc(String(e && e.message || e)) + ")."); }
        }
        if (!item && !phoneOnline()) {
          await agentSay("📴 No connection, and this page can't store photos safely on the phone (it needs a secure https:// address). Keep the photo in your gallery and send it when you're back online.");
          S.flowActive = false;
          return;
        }
        setState("CAPTURED");
        if (item) await agentSay("Photo saved <b>encrypted on this phone</b>. Names, ID numbers and phone numbers are never read 🔒", { fast: true });
        if (!phoneOnline()) {
          setState("PENDING_AI");
          await refreshStatus();
          await agentSay("📴 No connection. Kept on the phone: <b>Pending AI processing</b>. Nothing is lost — I'll send it and read it when the network returns. You can photograph the next page 📸");
          S.flowActive = false;
          setState(null);
          return;
        }
        let rec;
        try {
          if (item) rec = await uploadItem(item);
          else {
            const form = new FormData();
            form.append("photo", blob, "page.jpg");
            form.append("midwife_id", "mw-demo");
            rec = await api("POST", "/records", form, true);
          }
        } catch (e) {
          await refreshStatus();
          await agentSay("⚠️ " + esc(errText(e)) + (item ? "<br>The photo stays on the phone; I'll send it when the server is reachable." : ""));
          S.flowActive = false;
          return;
        }
        S.rec = rec;
        if (rec.state === "SUSPECTED_DUPLICATE") return askDuplicate(rec);
        setState("PENDING_AI");
        await continueRecord(rec.id);
      }

      // The server has seen this exact photo before: the midwife decides whether to process it again.
      async function askDuplicate(rec) {
        S.flowActive = true;
        S.rec = rec;
        setState("CAPTURED");
        await agentSay("🤔 I've already received <b>this exact photo</b> before. Is it really a new page?");
        const c = await askButtons([
          { label: "📸 Yes, process it", value: "go" },
          { label: "🗑️ No, it's a duplicate", value: "drop" }
        ]);
        if (c === "drop") { await agentSay("OK, I've set it aside 👍", { fast: true }); return finish(); }
        try { rec = await api("POST", "/records/" + rec.id + "/retry"); }
        catch (e) { await agentSay("⚠️ " + esc(errText(e))); return finish(); }
        S.rec = rec;
        setState("PENDING_AI");
        await continueRecord(rec.id);
      }

      async function continueRecord(id) {
        try {
          await working(api("POST", "/queue/process"));
          S.rec = await api("GET", "/records/" + id);
        } catch (e) { await agentSay("⚠️ " + esc(errText(e))); return; }
        await refreshStatus();
        const rec = S.rec;
        if (rec.state === "PENDING_AI") {
          await agentSay("⏳ Still waiting to be processed (" + esc(rec.last_error || "will retry") + ").");
          return;
        }
        if (rec.state === "PROCESSING_FAILED") {
          await agentSay("😕 I couldn't read this photo" + (rec.last_error ? " (<span class='mut'>" + esc(rec.last_error) + "</span>)" : "") + ".");
          return retakeOrManual();
        }
        if (rec.state === "MANUAL_REVIEW_REQUIRED") {
          await agentSay("🤔 I don't recognise which registry page this is.");
          return retakeOrManual();
        }
        setState("AI_PROCESSED");
        await agentSay(summaryHtml(rec), { fast: true });
        setState("TO_REVIEW");
        await reviewQuestions();
      }

      async function retakeOrManual() {
        const c = await askButtons([
          { label: "📸 Retake photo", value: "retake" },
          { label: "⌨️ Type it myself", value: "manual" }
        ]);
        if (c === "retake") {
          S.awaitingPhoto = true;
          await agentSay("Send the photo again (tap 📎). Flat page, good light, whole page in the frame 🙂");
          return;
        }
        const pages = [["cover", "Cover"], ["identification", "Identification"], ["current_pregnancy", "Current pregnancy"],
                       ["delivery", "Delivery"], ["postpartum_early_mother", "Postpartum (mother, early)"],
                       ["postpartum_early_newborn", "Postpartum (newborn, early)"],
                       ["postpartum_late_mother", "Postpartum (mother, late)"], ["postpartum_late_newborn", "Postpartum (newborn, late)"]];
        await agentSay("Which page is it?", { fast: true });
        const p = await askButtons(pages.map(x => ({ label: x[1], value: x[0] })));
        try { S.rec = await api("POST", "/records/" + S.rec.id + "/manual", { page_type: p }); }
        catch (e) { await agentSay("⚠️ " + esc(errText(e))); return; }
        await agentSay("OK — tap <b>✏️ Correct a field</b> to enter values, then confirm. Empty fields stay <b>NOT_PROVIDED</b>.", { fast: true });
        S.rec.state = "MANUAL_REVIEW_REQUIRED";
        await reviewMenu();
      }

      function flag(f) {
        if (f.status === "UNKNOWN") return "◻️ UNKNOWN";
        if (f.status === "NOT_APPLICABLE") return "— N/A";
        if (f.status === "NEEDS_REVIEW") return "⚠️ NEEDS_REVIEW";
        if (f.status === "ILLEGIBLE") return "❓ ILLEGIBLE";
        return f.corrected_by_midwife ? "✏️" : "✅";
      }

      function summaryHtml(rec) {
        const shown = rec.filled.slice(0, 8).map(f =>
          "• " + esc(f.label_en) + ": <b>" + esc(f.display ?? "—") + "</b> " + flag(f) +
          " · conf " + Number(f.confidence).toFixed(2)).join("<br>");
        const more = rec.filled.length > 8 ? "<br><span class='mut'>…and " + (rec.filled.length - 8) + " more filled fields</span>" : "";
        const counts = Object.entries(rec.summary || {}).map(([k, v]) => v + " " + k).join(" · ");
        const quality = rec.image_quality && rec.image_quality.issues && rec.image_quality.issues.length
          ? "<br>📷 Photo: " + esc(rec.image_quality.issues.join(", ")) : "";
        return "📋 <b>" + esc(rec.page_type_label || rec.page_type) + "</b><br>" + shown + more +
               "<br><span class='mut'>" + esc(counts) + quality + "</span>" +
               '<br><span class="mut">🔒 No direct identifiers stored</span>';
      }

      async function sendAnswers(answers) {
        try {
          S.rec = await api("PATCH", "/records/" + S.rec.id + "/fields", { answers });
          return true;
        } catch (e) { await agentSay("⚠️ " + esc(errText(e))); return false; }
      }

      async function askOne(f) {
        const seen = f.display != null && f.display !== "" ? " I read <b>" + esc(f.display) + "</b>" : " I couldn't read it";
        const why = f.issues && f.issues.length ? " <span class='mut'>(" + esc(f.issues.join("; ")) + ")</span>" : "";
        await agentSay("⚠️ <b>" + esc(f.label_en) + "</b>:" + seen + " — confidence " + Number(f.confidence).toFixed(2) + why +
                       "<br><span class='mut'>" + esc(f.question_fr) + "</span>");
        const opts = [];
        if (f.display != null && f.display !== "") opts.push({ label: "✅ That's right", value: "confirm" });
        opts.push({ label: "⌨️ Type the value", value: "type" }, { label: "◻️ Unknown", value: "unknown" },
                  { label: "⏭️ Skip", value: "skip" });
        const c = await askButtons(opts);
        if (c === "skip") return;
        if (c === "confirm") return sendAnswers({ [f.key]: { confirm: true } });
        if (c === "unknown") {
          if (await sendAnswers({ [f.key]: { status: "UNKNOWN" } }))
            await agentSay("Marked as <b>UNKNOWN</b> — missing info is a real answer, not an error 👌", { fast: true });
          return;
        }
        await agentSay("Type the value for <b>" + esc(f.label_en) + "</b>:", { fast: true });
        await typeUntilAccepted(f.key, f.label_en);
      }

      // Keeps asking until the server accepts the value (a date must be a date, Pos/Neg must be Pos/Neg...).
      async function typeUntilAccepted(key, label) {
        for (;;) {
          const v = await waitText();
          if (await sendAnswers({ [key]: { text: v } })) {
            const nf = (await api("GET", "/records/" + S.rec.id)).fields[key];
            await agentSay(esc(label) + " = <b>" + esc(nf.display ?? v) + "</b> ✓ <span class='mut'>(entered by midwife)</span>", { fast: true });
            return;
          }
          await agentSay("Try again, or send <b>?</b> if it's unknown.", { fast: true });
        }
      }

      async function reviewQuestions() {
        const queue = S.rec.needs_review.slice();
        if (!queue.length) {
          await agentSay("Everything was read with confidence ✅", { fast: true });
          return reviewMenu();
        }
        await agentSay(queue.length + " field(s) need your eyes. Least confident first:", { fast: true });
        for (const f of queue.slice(0, ASK_FIRST)) await askOne(f);
        const rest = S.rec.needs_review.filter(f => !queue.slice(0, ASK_FIRST).some(q => q.key === f.key));
        if (rest.length) {
          await agentSay(rest.length + " more field(s) are flagged.");
          const c = await askButtons([
            { label: "🔍 Go through them", value: "all" },
            { label: "✅ They're right as read", value: "confirm" },
            { label: "⚠️ Leave them flagged", value: "leave" }
          ]);
          if (c === "all") for (const f of rest) await askOne(f);
          else if (c === "confirm") {
            const ans = {};
            rest.forEach(f => { ans[f.key] = f.display ? { confirm: true } : { status: "ILLEGIBLE" }; });
            await sendAnswers(ans);
          }
        }
        await reviewMenu();
      }

      async function reviewMenu() {
        const c = await askButtons([
          { label: "✅ Confirm all", value: "confirm" },
          { label: "✏️ Correct a field", value: "correct" },
          { label: "📸 Retake photo", value: "retake" }
        ]);
        if (c === "retake") {
          S.awaitingPhoto = true;
          await agentSay("No problem — send the photo again (tap 📎). Flat page, good light, whole page in the frame 🙂");
          return;
        }
        if (c === "correct") return correctField();
        try {
          if (S.rec.state === "MANUAL_REVIEW_REQUIRED") { await agentSay("Enter at least one value first ✏️", { fast: true }); return reviewMenu(); }
          S.rec = await api("POST", "/records/" + S.rec.id + "/validate");
        } catch (e) { await agentSay("⚠️ " + esc(errText(e))); return reviewMenu(); }
        setState("VALIDATED");
        await agentSay("Record <b>validated</b> ✅ Now, which patient is this?", { fast: true });
        linking();
      }

      async function correctField() {
        const full = await api("GET", "/records/" + S.rec.id);
        const all = Object.values(full.fields);
        await agentSay("Type part of the field name (e.g. <i>tension</i>, <i>weight</i>, <i>DPA</i>):", { fast: true });
        const q = (await waitText()).toLowerCase();
        const hits = all.filter(f => (f.label_en + " " + f.label_fr + " " + f.key).toLowerCase().includes(q)).slice(0, 8);
        if (!hits.length) {
          await agentSay("No field matches “" + esc(q) + "”.", { fast: true });
          return reviewMenu();
        }
        const k = await askButtons(hits.map(f => ({
          label: esc(f.label_en) + (f.key.includes(".") ? " <span class='mut'>(" + esc(f.key) + ")</span>" : ""), value: f.key })));
        const f = full.fields[k];
        await agentSay("Send the correct value for <b>" + esc(f.label_en) + "</b>" +
                       (f.display ? " (now: " + esc(f.display) + ")" : "") + ":", { fast: true });
        await typeUntilAccepted(k, f.label_en);
        reviewMenu();
      }

      function patientCard(p) {
        const when = p.last_visit ? new Date(p.last_visit).toLocaleDateString() : "—";
        const near = p.distance > 0 ? " <span class='mut'>(1 character different)</span>" : "";
        return '<div class="pcard"><b>👤 ' + esc(p.code) + "</b>" + near + "<br>" + p.visits + " page(s) on file · " +
               esc((p.pages || []).join(", ") || "—") + '<br><span class="mut">last visit: ' + esc(when) + "</span></div>";
      }

      async function link(code, create) {
        try {
          S.rec = await api("POST", "/records/" + S.rec.id + "/link", { patient_code: code, create });
        } catch (e) { await agentSay("⚠️ " + esc(errText(e))); return false; }
        setState("PATIENT_LINKED");
        await delay(250);
        setState("SAVED");
        return true;
      }

      async function linking() {
        const opts = [];
        if (S.rec.record_number) {
          await agentSay("The page says patient code <b>" + esc(S.rec.record_number) + "</b>.", { fast: true });
          opts.push({ label: "👍 Use " + esc(S.rec.record_number), value: "page" });
        }
        opts.push({ label: "🔗 I have a code", value: "code" }, { label: "🆕 New patient", value: "new" });
        const c = await askButtons(opts);
        if (c === "new") {
          const { code } = await api("GET", "/patients/new-code");
          if (await link(code, true))
            await agentSay("Created profile <b>" + esc(code) + "</b> 🔗 Write this code on the registry page — the next visit will link to it.", { fast: true });
          return finish();
        }
        let code = S.rec.record_number;
        if (c === "code") {
          await agentSay("Send me the patient's code:", { fast: true });
          code = await waitText();
        }
        let matches = [];
        try { matches = await api("GET", "/patients?code=" + encodeURIComponent(code)); }
        catch (e) { await agentSay("⚠️ " + esc(errText(e))); return linking(); }
        if (!matches.length) {
          await agentSay("No profile has code <b>" + esc(code) + "</b> (and no near match).", { fast: true });
          const m = await askButtons([
            { label: "🆕 Create it", value: "create" },
            { label: "🔗 Try another code", value: "again" },
            { label: "🤷 I'm not sure", value: "unsure" }
          ]);
          if (m === "create") {
            if (await link(code, true))
              await agentSay("Created profile <b>" + esc(code) + "</b> 🔗 Write this code on the registry page — the next visit will link to it.", { fast: true });
            return finish();
          }
          if (m === "again") return linking();
          await agentSay("Kept <b>unlinked</b> for now — a supervisor can merge profiles later. Better safe than duplicated 👍", { fast: true });
          return finish();
        }
        await agentSay(matches.length + " profile(s) match this code. You decide — I never link on my own:", { fast: true });
        matches.forEach(p => addMsg("in", patientCard(p)));
        const btns = matches.map(p => ({ label: "👤 Link to " + esc(p.code), value: p.code }));
        btns.push({ label: "None of these — create new", value: "none" }, { label: "🤷 I'm not sure", value: "unsure" });
        const m = await askButtons(btns);
        if (m === "unsure") {
          await agentSay("Kept <b>unlinked</b> for now — a supervisor can merge profiles later. Better safe than duplicated 👍", { fast: true });
          return finish();
        }
        if (m === "none") {
          const { code: fresh } = await api("GET", "/patients/new-code");
          if (await link(fresh, true))
            await agentSay("Created profile <b>" + esc(fresh) + "</b> 🔗 Write this code on the registry page — the next visit will link to it.", { fast: true });
          return finish();
        }
        if (await link(m, false))
          await agentSay("Visit linked to profile <b>" + esc(m) + "</b> ✅", { fast: true });
        return finish();
      }

      // End of one record: sync, then the next page sent from the phone, or a new visit.
      async function finish() {
        await syncNow();
        const opts = [{ label: "🔄 Start a new visit", value: "new" }];
        if (S.toReview.length) opts.unshift({ label: "📋 Review the next page sent from the phone (" + S.toReview.length + ")", value: "next" });
        const c = await askButtons(opts);
        if (c === "next") { sysMsg("Next page"); S.flowActive = false; S.rec = null; setState(null); return reviewNext(); }
        if (c === "new") reset();
      }

      function reset() {
        S.flowActive = false;
        S.awaitingPhoto = false;
        S.waiter = null;
        S.rec = null;
        setState(null);
        sysMsg("New visit");
        refreshStatus();
        greeting();
      }

      async function greeting() {
        await agentSay("👋 Hello! I'm the <b>DayOne agent</b> — the pregnancy registry, digitized.", { fast: true });
        await agentSay("📸 Send a photo of a registry page (tap 📎). It works without network too: photos wait, encrypted on this phone, and are sent when the connection returns (try the <b>📶 Online</b> switch in the header). Send <b>/new</b> anytime to start over.");
        if (!Outbox.ok)
          await agentSay("⚠️ This page isn't on a secure address, so it <b>can't keep photos on the phone</b> while offline — photos are sent straight to the server. Open it over https:// (see README, Phone setup).", { fast: true });
      }

      /* ================= Image preview & send ================= */
      const preview = document.getElementById("preview");
      const pimg = document.getElementById("pimg");
      const pcaption = document.getElementById("pcaption");
      let pendingImage = null;

      function showPreview(dataUrl) {
        pendingImage = dataUrl;
        pimg.src = dataUrl;
        pcaption.value = "";
        preview.style.display = "flex";
        pcaption.focus();
        scroll();
      }
      function clearPreview() {
        pendingImage = null;
        preview.style.display = "none";
      }
      document.getElementById("pclear").onclick = clearPreview;
      document.getElementById("psend").onclick = () => sendPendingImage();
      pcaption.addEventListener("keydown", e => { if (e.key === "Enter") sendPendingImage(); });

      function sendPendingImage() {
        if (!pendingImage) return;
        const cap = pcaption.value.trim() || input.value.trim() || "Registry page 📸";
        const url = pendingImage;
        clearPreview();
        input.value = "";
        addMsg("out", esc(cap), { img: url });
        onPhoto(url, true);
      }

      /* ================= User input ================= */
      function sendText() {
        if (pendingImage) { sendPendingImage(); return; }
        const v = input.value.trim();
        if (!v) return;
        input.value = "";
        addMsg("out", esc(v));
        if (v.toLowerCase() === "/new") { reset(); return; }
        if (S.waiter) {
          const w = S.waiter;
          S.waiter = null;
          w(v);
          return;
        }
        if (S.flowActive && !S.awaitingPhoto) {
          agentSay("Tap a button to continue 🙂 or send <b>/new</b> to start over.", { fast: true });
        } else if (S.awaitingPhoto) {
          agentSay("I'm waiting for a photo 📸 — tap 📎 to upload the page again.", { fast: true });
        } else {
          agentSay("I'm the DayOne agent 🩺 Send a photo of a registry page (tap 📎) to start a record.", { fast: true });
        }
      }

      function onPhoto(dataUrl, shown) {
        if (S.awaitingPhoto) {
          S.awaitingPhoto = false;
          startFromPhoto(dataUrl, shown);
          return;
        }
        if (S.flowActive) {
          agentSay("I'm still working on one record — finish this visit (or send <b>/new</b>) before starting another.", { fast: true });
          return;
        }
        startFromPhoto(dataUrl, shown);
      }

      document.getElementById("send").onclick = sendText;
      input.addEventListener("keydown", e => { if (e.key === "Enter") sendText(); });
      document.getElementById("attach").onclick = () => document.getElementById("file").click();
      document.getElementById("file").addEventListener("change", e => {
        const f = e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => showPreview(r.result);
        r.readAsDataURL(f);
        e.target.value = "";
      });

      /* ================= Init ================= */
      if ("serviceWorker" in navigator && window.isSecureContext)
        navigator.serviceWorker.register("/sw.js").catch(e => console.warn("offline page cache unavailable:", e));
      lastOnline = phoneOnline();
      updateConn();
      refreshStatus();
      greeting().then(() => { if (phoneOnline()) sendOutbox(); });
    </script>
  </body>
</html>
